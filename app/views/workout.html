<div class="col-md-12">
    <div class="page-header">
        <p>
            You can sort your exercises as you like!
            <br>
            Then scroll to the bottom and hit it!
        </p>
    </div>
    <div class="col-md-12" style="overflow-x: hidden;">
        <ul ui-sortable="sortableOptions" ng-model="exercises" class="list-group">
            <li ng-repeat="exercise in exercises" class="list-group-item">
                {{exercise.name}}
            </li>
        </ul>
        <div class="text-center">
            <button class="btn-success btn-lg" ng-click="startWorkout()">Start Workout</button>
        </div>
    </div>
</div>
