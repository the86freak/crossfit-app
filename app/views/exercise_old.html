<style>
    html {
        height: 100%;
        width: 100%;
        overflow: hidden;
        min-width: 100%;
        min-height: 100%;
    }

    body {
        height: 100%;
        width: 100%;
        padding: 0;
        margin: 0;
    }

    .container-fluid {
        height: 100%;
        width: 100%;
        display: table;
        width: 100%;
        padding: 0;
        padding-top: 30px;
        position: absolute;
    }

    .row-fluid {
        height: 70%;

        padding-left: 10%;
        padding-right: 30%;
        padding-top: 10%;

        display: table-cell;
        position: absolute;
        width: 100%;
    }

    .centering {
        vertical-align: middle;
        float: none;
        margin: 0 auto;
    }

    .ctr_btm {
        width: 100px;
        height: 40px;
        text-align: center;
        vertical-align: middle;
    }

    .left {
        float: left;
    }

    .right {
        float: right;
    }
</style>

<div class="container-fluid" style="background: lightblue;">
    <audio id="alarm" preload="auto">
        <source src="resources/ring.mp3">
    </audio>
    <div class="page-header text-center" style="height:80px;text-shadow: white 0.2em 0.2em 0.2em;">
        <h3>{{exercise.name | uppercase}}</h3>
    </div>
    <div class="row-fluid">
        <button class="btn btn-lg btn-info pull-left" ng-click="pause()">
            <span class="glyphicon glyphicon-pause"/>
        </button>
        <button class="btn btn-lg btn-info pull-right" ng-click="nextExercise(false)">
            <span class="glyphicon glyphicon-chevron-right"/>&nbsp;skip <small>(don't save)</small>
        </button>
        <div class="centering">
            <div ng-show="counter>0" style="color: lavender; font-size: 3em;
            text-shadow: lightgrey 0.02em 0.02em 0.02em;">
                Beat: {{currentRepetitions}}
            </div>
            <div ng-show="counter>0" style="color: lavender; font-size: 12em;
            text-shadow: lightgrey 0.02em 0.02em 0.02em;">
                {{(counter/1000)|number:1}}
            </div>
            <div style="color: lavender; padding-left: 35px; font-size: 5em;
                   text-shadow: lightgrey 0.02em 0.02em 0.02em;"
                 ng-show="counter==0" hm-Swipe-Up="increase(5)" hm-Swipe-Down="decrease(5)">
                <span class="glyphicon glyphicon-chevron-up" ng-click="increase(1)"></span>
                <br>
                {{currentRepetitions}}
                <br>
                <span class="glyphicon glyphicon-chevron-down" ng-click="decrease(1)"></span>
            </div>
        </div>
        <button ng-show="counter==0" class="btn btn-lg btn-info pull-right pull-down" ng-click="nextExercise(true)">
            <span class="glyphicon glyphicon-chevron-right"/> save&next
        </button>
    </div>
</div>
